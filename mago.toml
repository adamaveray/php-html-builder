extends = "node_modules/@averay/codeformat/mago.base.toml"

[source]
excludes = ["node_modules/**"]
paths = ["."]

[formatter]
sort-class-methods = false

[linter.rules]
ambiguous-function-call = { enabled = false }

[guard.perimeter.layers]
dependencies = ["League\\Uri\\**", "Psr\\Http\\Message\\**", "Symfony\\Component\\Mime\\**"]

[[guard.perimeter.rules]]
namespace = "@global"
permit = ["@all"]

[[guard.structural.rules]]
on = "Averay\\HtmlBuilder\\**"
not-on = "Averay\\HtmlBuilder\\Tests\\**"
target = "class"
must-be-final = true
must-be-readonly = true
reason = "Builders are stateless and should not be extended."

# Components
[[guard.perimeter.rules]]
namespace = "Averay\\HtmlBuilder\\Components\\"
permit = ["@native", "Averay\\HtmlBuilder\\Components\\**"]

[[guard.structural.rules]]
on = "Averay\\HtmlBuilder\\Components\\**"
must-be = ["interface"]
reason = "Components defines contracts for consumers to implement."

# HTML & CSS utilities
[[guard.perimeter.rules]]
namespace = "Averay\\HtmlBuilder\\Css\\"
permit = ["@native", "@layer:dependencies", "Averay\\HtmlBuilder\\Css\\**", "Averay\\HtmlBuilder\\Components\\**"]

[[guard.perimeter.rules]]
namespace = "Averay\\HtmlBuilder\\Html\\"
permit = ["@native", "@layer:dependencies", "Averay\\HtmlBuilder\\Html\\**", "Averay\\HtmlBuilder\\Components\\**"]

# Tests
[[guard.perimeter.rules]]
namespace = "Averay\\HtmlBuilder\\Tests\\"
permit = ["@all"]

[[guard.structural.rules]]
on = "Averay\\HtmlBuilder\\Tests\\**"
not-on = "Averay\\HtmlBuilder\\Tests\\Lib\\**"
target = "class"
must-be-final = true
must-be-readonly = false # The base PHPUnit test case is not readonly
reason = "Test cases are not for extension."
